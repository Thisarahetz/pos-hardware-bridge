name: Docs

# Publishes https://thisarahetz.github.io/pos-hardware-bridge/ from master.
on:
  push:
    branches: [master]
    paths: ['website/**', 'docs/**', 'zensical.toml', 'packages/sdk/README.md', 'CONTRIBUTING.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Build
        run: |
          # The API reference page and specs, served at /reference/
          mkdir -p website/reference && cp docs/index.html docs/*.yaml website/reference/
          zensical build --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
