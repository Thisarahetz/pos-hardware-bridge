name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Compile the app
        run: npm run build
      - name: Receipt layout copies are identical
        run: cmp src/main/printer/receipt-layout.ts packages/sdk/src/layout.ts
      - name: Test the SDK
        run: npm test
        working-directory: packages/sdk

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - name: Build the docs (fails on broken links)
        run: |
          mkdir -p website/reference && cp docs/index.html docs/*.yaml website/reference/
          mkdocs build --strict
