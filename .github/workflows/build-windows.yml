name: Build Windows installer

# Branch pushes build a test installer (kept as a workflow artifact).
# A GitHub Release is published when:
#   - a version tag (v1.2.3) is pushed, or
#   - the workflow is run by hand (Actions → Run workflow) on master.
# The release version comes from package.json, so bump it before releasing.
on:
  workflow_dispatch:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']

# Publishing a release needs write access to the repo.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No code-signing certificate yet: build an unsigned installer.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read the version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${{ steps.version.outputs.tag }}" = "${GITHUB_REF_NAME}"

      # A release counts as done once it carries latest.yml (what installed
      # bridges update from). A half-finished one is completed, not blocked.
      - name: Check this version isn't released yet
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "::error::${{ steps.version.outputs.tag }} is already released. Bump \"version\" in package.json and run again."
            exit 1
          fi

      # electron-builder only builds. The release is created and filled below
      # with the GitHub CLI, one step at a time, so a hiccup can't leave it half done.
      - name: Build installer
        run: npm run dist:win -- --publish never

      - name: Publish the GitHub Release
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # A copy with no version in its name, so the docs can link to
          # releases/latest/download/POS-Hardware-Bridge-Setup.exe.
          cp release/POS-Hardware-Bridge-Setup-*.exe release/POS-Hardware-Bridge-Setup.exe
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            release/POS-Hardware-Bridge-Setup-*.exe \
            release/POS-Hardware-Bridge-Setup-*.exe.blockmap \
            release/POS-Hardware-Bridge-Setup.exe \
            release/latest.yml
          gh release edit "$TAG" --draft=false --latest

      - uses: actions/upload-artifact@v4
        with:
          name: POS-Hardware-Bridge-Setup
          path: release/POS-Hardware-Bridge-Setup-*.exe
          if-no-files-found: error

      - name: Show the update files the release carries
        shell: bash
        run: ls -la release/*.yml release/win-unpacked/resources/app-update.yml 2>/dev/null || echo "no update files (branch build)"
