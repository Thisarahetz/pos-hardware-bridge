name: SDK

on:
  push:
    branches: [master, 'feature/**']
    paths: ['packages/sdk/**', 'package-lock.json', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['packages/sdk/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tests render receipts with the ReceiptLine version the bridge ships.
      - run: npm ci --ignore-scripts
      - run: npm test
        working-directory: packages/sdk
